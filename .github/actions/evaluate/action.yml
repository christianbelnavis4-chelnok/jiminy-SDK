name: 'Jiminy Evaluate'
description: >-
  Evaluate DecisionTrace fixtures against the Jiminy accountability API on
  every PR/commit and fail the build on a bad verdict. See
  docs/SELF_SERVE_SDK_SPEC.md (Sprint 2) and scripts/ci_evaluate.py.
author: 'Jiminy'
branding:
  icon: 'shield'
  color: 'green'

inputs:
  api-key:
    description: 'Jiminy X-API-Key (store as a repo/org secret, never checked in)'
    required: true
  base-url:
    description: 'Jiminy API base URL, e.g. https://jiminy-api-<project>.a.run.app'
    required: true
  traces-glob:
    description: 'Glob pattern for DecisionTrace JSON fixtures, relative to the calling repo'
    required: false
    default: 'traces/*.json'
  fail-on:
    description: >-
      Minimum verdict severity that fails the build: "rejected" (default,
      only hard rejections break CI) or "flagged" (also breaks CI on a
      flagged verdict).
    required: false
    default: 'rejected'
  calibrate:
    description: >-
      Use calibration mode (?mode=calibrate) — results aren't persisted and
      don't count against quota. Recommended for a first CI integration
      before committing to a --fail-on policy on real submissions.
    required: false
    default: 'false'
  comment-on-pr:
    description: >-
      Post (and keep updated on every push) a PR comment with the
      per-trace verdict table, in addition to the job's own
      $GITHUB_STEP_SUMMARY. No-op on a non-pull_request event (e.g. a push
      to main). Requires github-token to have pull-requests: write — the
      default GITHUB_TOKEN has this on same-repo PRs if your workflow sets
      `permissions: pull-requests: write`, but is always read-only on PRs
      from forks regardless of that setting. A comment that fails to post
      is a warning, not a build failure — the evaluation itself still gates
      the build via this action's exit code either way.
    required: false
    default: 'true'
  github-token:
    description: 'Token used to post the PR comment. Only read when comment-on-pr is true.'
    required: false
    default: ${{ github.token }}

outputs:
  exit-code:
    description: '0 if every trace passed the --fail-on threshold, 1 otherwise'
    value: ${{ steps.evaluate.outputs.exit-code }}

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Run Jiminy evaluation
      id: evaluate
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        CALIBRATE_FLAG=""
        if [ "${{ inputs.calibrate }}" = "true" ]; then
          CALIBRATE_FLAG="--calibrate"
        fi
        COMMENT_FLAG=""
        if [ "${{ inputs.comment-on-pr }}" = "true" ]; then
          COMMENT_FLAG="--comment-on-pr"
        fi
        set +e
        python "${{ github.action_path }}/../../../scripts/ci_evaluate.py" \
          --api-key "${{ inputs.api-key }}" \
          --base-url "${{ inputs.base-url }}" \
          --traces-glob "${{ inputs.traces-glob }}" \
          --fail-on "${{ inputs.fail-on }}" \
          --github-token "${{ inputs.github-token }}" \
          $CALIBRATE_FLAG $COMMENT_FLAG
        code=$?
        set -e
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        exit $code
