name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  hygiene:
    name: Public-repo hygiene check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history needed: the check diffs across a commit range, not
          # just the tip commit.
          fetch-depth: 0

      - name: Check commit messages and PR text for internal references
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 scripts/check_public_repo_hygiene.py

  test:
    name: Lint, test
    runs-on: ubuntu-latest
    env:
      # CrewAI's own telemetry client tries to phone home to
      # telemetry.crewai.com on import in a background thread — harmless
      # but noisy (read-timeout stack traces) in a CI sandbox with no
      # outbound access to that host. Disabled for test runs only.
      CREWAI_DISABLE_TELEMETRY: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev,langchain,crewai]"

      - name: Lint
        run: python -m ruff check .

      - name: Test
        run: python -m pytest tests/ -q
