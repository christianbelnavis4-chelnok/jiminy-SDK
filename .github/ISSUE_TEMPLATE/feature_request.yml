name: Feature request
description: Suggest a scoped change to the SDK, CLI, or API.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Broader "what should Jiminy do" ideas are a better fit for
        [Discussions](../../discussions). Use this template for a specific,
        scoped change to this repo.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What are you trying to do that the SDK doesn't currently support?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What would you like to see added or changed?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds you're using now, or other approaches you considered.
