name: Bug report
description: Something in the SDK, an adapter, or the CI action isn't working as expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing: have you checked [Discussions](../../discussions)?
        If you're not sure whether this is a bug or expected behaviour,
        ask there first.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal steps, including any trace or request payload if relevant.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: jiminy-sdk version
      placeholder: e.g. 0.1.0
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python version
      placeholder: e.g. 3.11.6
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Paste any error output or stack trace. This will be formatted as code automatically.
      render: shell
