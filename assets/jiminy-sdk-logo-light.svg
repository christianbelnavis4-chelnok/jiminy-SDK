<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 160" width="500" height="160" role="img" aria-label="Jiminy — Agent Accountability">
  <defs>
    <style>
      .wordmark { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 800; }
      .subtitle { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 700; letter-spacing: 4px; }
    </style>
  </defs>

  <!-- hexagon logo mark -->
  <g transform="translate(85,80)">
    <polygon points="0,-72 62,-36 62,36 0,72 -62,36 -62,-36" fill="none" stroke="#1C1F1D" stroke-width="5"/>
    <line x1="-34" y1="34" x2="34" y2="-34" stroke="#4A9B5F" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- divider -->
  <line x1="176" y1="24" x2="176" y2="136" stroke="#4A9B5F" stroke-width="3"/>

  <!-- wordmark -->
  <text x="200" y="95" class="wordmark" font-size="56" fill="#1C1F1D">JIMINY</text>
  <text x="201" y="128" class="subtitle" font-size="15" fill="#4A9B5F">AGENT ACCOUNTABILITY</text>
</svg>
