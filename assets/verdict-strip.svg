<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 160" width="940" height="160" role="img" aria-label="Verdict taxonomy: approved, all six criteria pass. flagged, one or more concern, no fails. rejected, any fail, or high-risk concern for the domain.">
  <defs>
    <style>
      .title { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 700; }
      .body { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 400; }
    </style>
  </defs>

  <rect x="0" y="0" width="940" height="160" fill="#141615"/>

  <!-- approved -->
  <g transform="translate(20,20)">
    <rect x="0" y="0" width="280" height="120" rx="8" fill="#1C1F1D" stroke="#4A9B5F" stroke-width="2"/>
    <text x="24" y="42" class="title" font-size="20" fill="#F7F6F2">approved</text>
    <text x="24" y="72" class="body" font-size="14" fill="#B9BCB9">All six criteria PASS</text>
  </g>

  <!-- flagged -->
  <g transform="translate(330,20)">
    <rect x="0" y="0" width="280" height="120" rx="8" fill="#1C1F1D" stroke="#C9A84C" stroke-width="2"/>
    <text x="24" y="42" class="title" font-size="20" fill="#F7F6F2">flagged</text>
    <text x="24" y="72" class="body" font-size="14" fill="#B9BCB9">One or more CONCERN,</text>
    <text x="24" y="92" class="body" font-size="14" fill="#B9BCB9">no FAILs</text>
  </g>

  <!-- rejected -->
  <g transform="translate(640,20)">
    <rect x="0" y="0" width="280" height="120" rx="8" fill="#1C1F1D" stroke="#F7F6F2" stroke-width="2"/>
    <text x="24" y="42" class="title" font-size="20" fill="#F7F6F2">rejected</text>
    <text x="24" y="72" class="body" font-size="14" fill="#B9BCB9">Any FAIL, or high-risk</text>
    <text x="24" y="92" class="body" font-size="14" fill="#B9BCB9">CONCERN for the domain</text>
  </g>
</svg>
